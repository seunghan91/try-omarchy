# fcitx5 would switch input methods on Ctrl+Space, which is also Omarchy's tmux
# and herdr prefix, and a Mac may take it for its own input source switcher
# first. Switch on the right Option key instead: tapping it alone toggles, and
# Option chords still reach apps. The dedicated 全角/半角 and 한/영 keys of
# Japanese and Korean keyboards switch too.
[Hotkey/TriggerKeys]
0=Zenkaku_Hankaku
1=Hangul
2=Alt_R
